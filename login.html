<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Book Management System - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <div class="left">

        <h1>Smart Book Management System</h1>

        <div class="login-box">

            <h2>Login</h2>

            <form>

                <input type="text" placeholder="ID / Admin" required>

                <input type="password" placeholder="Password" required>

                <button type="submit">Submit</button>

            </form>

            <p>
                Don't have an account?
                <a href="#">Register</a>
            </p>

        </div>

    </div>

    <div class="right">
        <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=700"
             alt="Books">
    </div>

</div>

</body>
</html>
