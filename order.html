<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBMS - Order Book</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>

<header>

    <div class="logo">
        <h2>SBMS</h2>
    </div>

    <div class="user">
        <span>Name</span>
        <a href="login.html">
            <button>Login</button>
        </a>
    </div>

</header>

<div class="container">

    <!-- Left Side -->
    <div class="left">

        <div class="book-image">
            <img src="https://picsum.photos/350/450" alt="Book">
        </div>

        <h2>Book Name</h2>

        <p>
            This is a sample description of the book. Here you can display
            the author, publication, category, number of pages, language,
            and other details about the selected book.
        </p>

    </div>

    <!-- Right Side -->

    <div class="right">

        <form>

            <label>Phone Number</label>

            <input type="tel"
                   placeholder="Enter Phone Number"
                   required>

            <label>Address</label>

            <textarea
            placeholder="Enter Delivery Address"
            rows="8"
            required></textarea>

            <div class="price">
                Price : ₹345
            </div>

            <button type="submit">
                Place Order
            </button>

        </form>

    </div>

</div>

</body>
</html>
